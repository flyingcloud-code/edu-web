    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#d9f3ff,transparent 34%),radial-gradient(circle at 80% 8%,#fff2b7,transparent 30%),linear-gradient(135deg,#f5fbff,#fffefa 55%,#eff8ff);min-height:100vh}.app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}aside{position:sticky;top:0;height:100vh;padding:22px 16px;background:rgba(255,255,255,.80);backdrop-filter:blur(18px);border-right:1px solid rgba(35,135,255,.16);overflow:auto}main{padding:26px;max-width:1480px}.brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}.brand h1{font-size:18px;margin:0;line-height:1.25}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.bot{width:66px;height:66px;position:relative;border-radius:50%;background:var(--blue);border:4px solid #fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.1),0 10px 20px rgba(35,135,255,.24)}.bot:before,.bot:after{content:"";position:absolute;top:13px;width:20px;height:24px;background:#fff;border:2px solid #18324f;border-radius:50%}.bot:before{left:11px}.bot:after{right:11px}.eye{position:absolute;top:25px;width:6px;height:8px;background:#111;border-radius:50%;z-index:2}.eye.l{left:24px}.eye.r{right:24px}.nose{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:13px;height:13px;background:var(--red);border:2px solid #fff;border-radius:50%;z-index:3}.mouth{position:absolute;left:50%;top:43px;transform:translateX(-50%);width:30px;height:12px;border-bottom:3px solid #18324f;border-radius:0 0 20px 20px}.nav button{width:100%;margin:6px 0;padding:12px 14px;border:0;border-radius:16px;background:transparent;text-align:left;color:var(--ink);font-weight:900;cursor:pointer}.nav button:hover{background:rgba(35,135,255,.08)}.nav button.active{background:linear-gradient(135deg,var(--blue),#66bdff);color:#fff;box-shadow:0 12px 24px rgba(35,1 t-size:12px}.todo label{display:flex;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);line-height:1.5;cursor:pointer}.todo label:last-child{border:0}input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}.assetGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.assetCard{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--soft)}.assetCard img{display:block;width:100%;height:170px;object-fit:cover;background:#eff8ff}.assetCard div{padding:12px}.assetCard strong{display:block}.assetCard span{font-size:13px;color:var(--muted);line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:15px;padding:11px 14px;font-weight:900;cursor:pointer}.tabs button{background:#eef5ff;color:var(--deep)}.tabs button.on,.btn{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(35,135,255,.23)}.btn.secondary{background:#eef5ff;color:var(--deep);box-shadow:none}.btn.danger{background:var(--red)}.toolPage{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}.toolbox label{display:block;font-weight:900;margin:10px 0 6px}.toolbox input,.input,textarea,select{width:100%;border:1px solid #dce8f5;border-radius:14px;padding:11px 12px;font-size:14px;outline:none;background:#fff}textarea{min-height:120px;resize:vertical;line-height:1.6}canvas{background:#fff;border:1px solid #dce8f5;border-radius:20px;max-width:100%}.formula{background:#101828;color:#fff;padding:13px 15px;border-radius:16px;font-weight:900;overflow:auto}.note{background:#fff9df;border:1px solid #ffec9d;border-radius:18px;padding:13px 15px;line-height:1.6;font-weight:800}.mini{font-size:13px;color:var(--muted)}.quizTop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.qbox{font-size:21px;font-weight:900;line-height:1.55;background:#f7fbff;border:1px solid #dcebff;border-radius:18px;padding:18px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.opt{padding:15px;border:2px solid #e1e9f5;border-radius:18px;background:#fff;text-align:left;font-size:16px;cursor:pointer}.opt:hover{border-color:var(--blue);transform:translateY(-1px)}.opt.ok{border-color:var(--green);background:#eafff5}.opt.no{border-color:var(--red);background:#fff0f2}.feedback{min-height:64px;padding:14px 16px;border-radius:18px;background:#fff9df;line-height:1.65;font-weight:800}.coverage,.heat{display:grid;gap:10px}.covrow{display:grid;grid-template-columns:150px 1fr 72px;gap:12px;align-items:center;padding:12px;background:#f7fbff;border-radius:16px}.meter{height:10px;background:#e9eef6;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--orange),var(--green))}.heatrow{display:grid;grid-template-columns:150px 1fr 1.2fr;gap:12px;align-items:center;padding:12px;background:#f7fbff;border-radius:16px}.stars button{border:0;background:transparent;font-size:22px;cursor:pointer;filter:grayscale(1);opacity:.42}.stars button.on{filter:none;opacity:1}.smalltable{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}.smalltable th,.smalltable td{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:14px}.smalltable th{background:#f3f8ff;color:var(--deep)}.diag{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.badge{padding:12px;border-radius:18px;background:#fff;border:1px solid var(--line);text-align:center}.badge b{display:block;font-size:22px}.answer{display:none;color:var(--deep);font-weight:900;line-height:1.5;margin-top:8px}.dragArea{display:grid;grid-template-columns:1fr 1fr;gap:14px}.bucket,.chipBox{min-height:220px;padding:12px;background:#f7fbff;border:2px dashed #cfe2fa;border-radius:18px}.chip{display:inline-block;margin:6px;padding:9px 11px;border-radius:999px;background:#fff;border:1px solid #d9e8f8;font-weight:900;cursor:grab}.bucket .chip{background:#eaf6ff}.mind{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.node{border:2px solid #d9ecff;background:linear-gradient(180deg,#fff,#f7fbff);border-radius:18px;padding:14px}.node strong{color:var(--deep)}.node ul{margin:8px 0 0 18px;padding:0}.stepper{display:grid;gap:10px}.step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px;border-radius:18px;background:#f7fbff}.step b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff}@media(max-width:1080px){.app{grid-template-columns:1fr}aside{position:relative;height:auto}.hero,.grid,.grid.two,.grid.four,.assetGrid,.toolPage,.opts,.diag,.dragArea,.mind{grid-template-columns:1fr}.heatrow,.covrow{grid-template-columns:1fr}main{padding:18px}.assetCard img{height:220px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="bot"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span><span class="mouth"></span></div><div><h1>橘宝老师小猫学习站</h1><p>知识图 · 交互工具 · 覆盖摸底 · 错因诊断</p></div></div>
    <div class="nav" id="nav"></div>
    <div class="progress"><div class="row"><strong>今日完成度</strong><span id="progressText">0%</span></div><div class="bar"><span id="progressBar"></span></div><p class="mini">完成清单、视觉工具、摸底、热力图、错因记录后自动上涨。</p></div>
  </aside>
  <main>
    <div class="hero">
      <div class="panel"><h2>Day 1 v3：<br>把数学变成“能看见、能拖动、能诊断”的学习站。</h2><p class="sub">今天不是只刷题。我们用小猫老师橘宝、8 张教学图、6 个交互工具和覆盖式题库，先把八年级数学的关键抽屉打开。</p><div class="tags"><span class="tag">本地单页 HTML</span><span class="tag">内置 assets 图</span><span class="tag">6 个视觉工具</span><span class="tag">题库覆盖</span><span class="tag">本地保存</span></div></div>
      <div class="panel teacher"><div class="bot bigbot"><span class="eye l"></span><span class="eye r"></span><span class="nose"></span><span class="mouth"></span></div><div class="speech" id="speech">我是橘宝老师。今天我们先不急着刷难题，先把“坐标、函数、根式、方程、几何、数据”这些工具箱排好。</div></div>
    </div>
    <section class="active" id="plan"></section><section id="assets"></section><section id="map"></section><section id="tools"></section><section id="quiz"></section><section id="heat"></section><section id="mistake"></section><section id="summary"></section>
  </main>
</div>
<script>
const sections=[['plan','① 今日路线','今天的任务：看图理解、用工具验证、再做覆盖式摸底。'],['assets','② 教学图片 assets','图片不是装饰，而是把抽象概念变成看得见的比喻。'],['map','③ 知识地图','先知道题目属于哪个知识抽屉，解题才不会乱。'],['tools','④ 6 个视觉工具','坐标、象限、平移、函数机器、一次函数、例题拆解，都要能互动。'],['quiz','⑤ 覆盖式摸底','不是 8 题贴标签，而是按模块覆盖，记录错因。'],['heat','⑥ 热力图','红区就是考前最值得救的区域。'],['mistake','⑦ 错题诊断','错题不抄答案，要查病因。'],['summary','⑧ 今日收口','把今天结果转成明天的行动计划。']];
const nav=document.getElementById('nav');sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s[1];b.className=i?'':'active';b.onclick=()=>show(s[0]);nav.appendChild(b)});function show(id){document.querySelectorAll('section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',sections[i][0]===id));document.getElementById('speech').textContent=sections.find(s=>s[0]===id)[2];scrollTo({top:0,behavior:'smooth'});setTimeout(drawCurrentTool,80)}
const modules=['坐标与平移','一次函数','三角形/全等','轴对称/等腰','二次根式','一元二次方程','勾股/四边形','数据分析'];
const state=JSON.parse(localStorage.getItem('day1v3')||'{}');state.stats=state.stats||{};state.errors=state.errors||{};state.done=state.done||{};
function svgAsset(kind,title,sub){const palettes={hero:['#2387ff','#ffd84d','#ffffff'],coordinate:['#2387ff','#22c783','#ff5b6e'],quadrant:['#7c5cff','#ffd84d','#2387ff'],move:['#22c783','#2387ff','#ffad33'],machine:['#2387ff','#7c5cff','#ffd84d'],slope:['#ff5b6e','#2387ff','#22c783'],example:['#ffd84d','#2387ff','#ffffff'],mindmap:['#22c783','#2387ff','#ff5b6e']};let p=palettes[kind]||palettes.hero;let icon='';
if(kind==='coordinate')icon='<line x1="40" y1="170" x2="360" y2="170"/><line x1="200" y1="30" x2="200" y2="300"/><circle cx="130" cy="90" r="10" fill="#ff5b6e"/><text x="143" y="94">P(-2,3)</text><path d="M200 170 L130 170 L130 90" stroke="#ff5b6e" stroke-dasharray="6 5"/>';
else if(kind==='quadrant')icon='<line x1="40" y1="170" x2="360" y2="170"/><line x1="200" y1="30" x2="200" y2="300"/><text x="270" y="95">+,+</text><text x="85" y="95">-,+</text><text x="85" y="245">-,-</text><text x="270" y="245">+,-</text><circle cx="285" cy="80" r="9" fill="#2387ff"/><circle cx="115" cy="80" r="9" fill="#7c5cff"/><circle cx="115" cy="245" r="9" fill="#ff5b6e"/><circle cx="285" cy="245" r="9" fill="#22c783"/>';
else if(kind==='move')icon='<rect x="70" y="175" width="80" height="65" rx="10" fill="#fff"/><path d="M60 178 L110 132 L160 178" fill="#ffad33"/><rect x="245" y="105" width="80" height="65" rx="10" fill="#fff"/><path d="M235 108 L285 62 L335 108" fill="#22c783"/><path d="M155 178 C190 145 210 120 238 105" stroke="#2387ff" stroke-width="6" fill="none" marker-end="url(#arr)"/><text x="96" y="270">(x,y)</text><text x="235" y="205">(x+a,y+b)</text>';
else if(kind==='machine')icon='<rect x="90" y="90" width="220" height="120" rx="28" fill="#fff"/><circle cx="135" cy="150" r="28" fill="#eaf6ff"/><text x="125" y="157">x</text><path d="M165 150 H238"/><circle cx="265" cy="150" r="28" fill="#fff7dc"/><text x="255" y="157">y</text><text x="135" y="235">输入 → 规则 → 输出</text>';
else if(kind==='slope')icon='<line x1="45" y1="240" x2="355" y2="240"/><line x1="75" y1="270" x2="75" y2="45"/><path d="M80 225 L345 80" stroke="#2387ff" stroke-width="6"/><path d="M80 75 L345 225" stroke="#ff5b6e" stroke-width="6"/><text x="245" y="75">k&gt;0 上坡</text><text x="245" y="220">k&lt;0 下坡</text>';
else if(kind==='example')icon='<rect x="65" y="70" width="270" height="58" rx="16" fill="#fff"/><rect x="65" y="145" width="270" height="58" rx="16" fill="#fff"/><rect x="65" y="220" width="270" height="58" rx="16" fill="#fff"/><text x="88" y="105">① 它考什么？</text><text x="88" y="180">② 用哪个规则？</text><text x="88" y="255">③ 怎样避坑？</text>';
else if(kind==='mindmap')icon='<circle cx="200" cy="165" r="42" fill="#fff"/><text x="170" y="172">Day 1</text><path d="M200 123 L110 70 M242 165 L330 120 M200 207 L105 250 M158 165 L80 160"/><circle cx="110" cy="70" r="25" fill="#eaf6ff"/><circle cx="330" cy="120" r="25" fill="#fff7dc"/><circle cx="105" cy="250" r="25" fill="#eafff5"/><circle cx="80" cy="160" r="25" fill="#fff0f2"/>';
else icon='<circle cx="200" cy="135" r="72" fill="#fff"/><circle cx="174" cy="120" r="22" fill="#eaf6ff"/><circle cx="226" cy="120" r="22" fill="#eaf6ff"/><circle cx="174" cy="125" r="5" fill="#111"/><circle cx="226" cy="125" r="5" fill="#111"/><circle cx="200" cy="150" r="11" fill="#ff5b6e"/><path d="M172 172 Q200 195 228 172" stroke="#223047" stroke-width="5" fill="none"/><rect x="110" y="230" width="180" height="44" rx="22" fill="#fff"/><text x="144" y="258">橘宝老师</text>';
let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2387ff"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient></defs><rect width="400" height="300" rx="28" fill="url(#g)"/><circle cx="330" cy="40" r="60" fill="rgba(255,255,255,.18)"/><g stroke="#223047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">${icon}</g><text x="24" y="34" font-size="22" font-weight="800" fill="#fff">${title}</text><text x="24" y="285" font-size="14" font-weight="700" fill="#fff">${sub}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
const assetData=[['cat_math_basics.png','橘宝老师开场','先建立今天的学习心智模型'],['cat_coordinate_graph.png','坐标=地图找地址','先横后纵，顺序不能反'],['cat_coordinate_translation.png','平移=整体搬家','x 管左右，y 管上下'],['cat_functions.png','函数=输入输出机器','一个输入对应唯一输出'],['cat_linear_functions.png','一次函数=斜坡','k 管坡度，b 管起点'],['cat_learning.png','例题拆解','先识别考点，再套规则'],['cat_playful_learning.png','互动练习','边拖边看，理解更快'],['cat_mind_map.png','复习脑图','最后把碎片收成地图']];
plan.innerHTML=`<div class="title"><div><h3>第 1 天路线：视觉理解 → 互动验证 → 覆盖摸底</h3><p>这版把 Day 1 做成真正能学的版本：不是只有题库，而是图、工具、题、错因一起闭环。</p></div></div><div class="grid"><div class="card"><h4>1. 看图理解</h4><p>先用 8 张教学图把抽象概念变成生活比喻：坐标像地图、平移像搬家、函数像机器、一次函数像斜坡。</p></div><div class="card"><h4>2. 互动验证</h4><p>6 个视觉工具分别覆盖坐标、象限、平移、函数机器、一次函数和例题拆解。</p></div><div class="card"><h4>3. 覆盖摸底</h4><p>按八个模块抽题，记录正确率和错因，最后自动生成明天优先级。</p></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">今日完成清单</h3><div class="todo">${['看完 8 张教学图','完成 2 个以上视觉工具','完成全覆盖摸底','查看覆盖报告','填写热力图','写下三个漏洞'].map((x,i)=>`<label><input type="checkbox" data-done="${i}" ${state.done[i]?'checked':''}>${x}</label>`).join('')}</div></div>`;
assets.innerHTML=`<div class="title"><div><h3>8 张小猫教学 assets 图</h3><p>这些图片放在 <b>assets/img/</b> 目录中，HTML 用相对路径引用。本地打开时，请保持 index.html 和 assets 文件夹在同一目录。</p></div></div><div class="assetGrid">${assetData.map(a=>`<div class="assetCard"><img src="assets/img/${a[0]}" alt="${a[1]}" onerror="this.src=svgAsset('hero','橘宝老师','缺少 assets/img 图片')"><div><strong>${a[0]}</strong><span>${a[1]}｜${a[2]}</span></div></div>`).join('')}</div><div class="note" style="margin-top:16px">小猫昵称建议：<b>橘宝老师</b>。它有加菲猫那种“圆润、懒萌、亲切”的感觉，但不是直接使用加菲猫形象，后续做成课程产品更安全。</div>`;
map.innerHTML=`<div class="title"><div><h3>八年级数学知识地图</h3><p>Day 1 先覆盖上册的坐标与一次函数，同时把全册关键模块都打开看一眼。</p></div></div><div class="mind">${[
['坐标与平移',['点的坐标：有序数对 (x,y)','象限符号：+ + / - + / - - / + -','平移：左右改 x，上下改 y']],

function pick(arr,n){return [...arr].sort(()=>Math.random()-.5).slice(0,n)}function startQuiz(m,btn){mode=m;if(btn){btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on')} if(m==='basic')quizArr=modules.map(mod=>qs.find(q=>q.m===mod&&q.d===1)).filter(Boolean); else if(m==='full')quizArr=modules.flatMap(mod=>pick(qs.filter(q=>q.m===mod),Math.min(2,qs.filter(q=>q.m===mod).length))); else quizArr=pick(qs,12);idx=0;score=0;locked=false;renderQ();renderCoverage();save()}function renderQ(){let item=quizArr[idx];qmeta.textContent=item?`${item.m}｜难度 ${item.d}`:'完成';scoreBox.textContent=`得分：${score}`;left.textContent=item?`第 ${idx+1}/${quizArr.length} 题`:'';qbox.textContent=item?item.q:'本轮完成，请看覆盖报告。';opts.innerHTML='';if(!item)return;item.o.forEach((op,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=op;b.onclick=()=>choose(i);opts.appendChild(b)});fb.textContent='请选择一个答案。';locked=false}function choose(i){if(locked||!quizArr[idx])return;locked=true;let item=quizArr[idx],ok=i===item.a;document.querySelectorAll('.opt')[item.a].classList.add('ok');if(!ok)document.querySelectorAll('.opt')[i].classList.add('no');if(ok)score++;state.stats[item.m]=state.stats[item.m]||{try:0,ok:0};state.stats[item.m].try++;if(ok)state.stats[item.m].ok++;else state.errors[item.err]=(state.errors[item.err]||0)+1;scoreBox.textContent=`得分：${score}`;fb.textContent=(ok?'答对了！':'错了，但这题很有价值。')+item.e+'｜错因标签：'+item.err;renderCoverage();save();updateProgress()}function nextQ(){if(idx<quizArr.length-1){idx++;renderQ()}else{fb.textContent=`本轮完成：${score}/${quizArr.length}。低于 70% 的模块，明天优先补。`;quizArr=[];renderQ();updateProgress()}}function restart(){startQuiz(mode)}function renderCoverage(){if(!coverage)return;coverage.innerHTML=modules.map(m=>{let s=state.stats[m]||{try:0,ok:0};let pct=s.try?Math.round(s.ok/s.try*100):0;return `<div class="covrow"><strong>${m}</strong><div class="meter"><i style="width:${pct}%"></i></div><span>${s.ok}/$ heat.innerHTML=`<div class="title"><div><h3>错题热力图</h3><p>1 星红区，5 星稳区。右边写一句“我最容易怎么错”。</p></div></div><div class="panel heat" id="heatRows"></div><div style="margin-top:12px"><button class="btn" onclick="saveHeat()">保存热力图</button> <button class="btn secondary" onclick="resetHeat()">清空</button></div>`;function renderHeat(){heatRows.innerHTML=modules.map((m,i)=>`<div class="heatrow"><strong>${m}</strong><div class="stars" data-h="${i}">${[1,2,3,4,5].map(n=>`<button data-star="${n}">★</button>`).join('')}</div><input class="input" data-note="${i}" placeholder="例：会背公式但不会用"></div>`).join('');let saved=state.heat||{};document.querySelectorAll('.stars').forEach(st=>{let i=st.dataset.h,val=saved[i]?.star||0;st.dataset.value=val;st.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.star<=val));st.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.dataset.value=b.dataset.star;st.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.star<=+b.dataset.star));updateProgress()})});document.querySelectorAll('[data-note]').forEach(inp=>{let i=inp.dataset.note;if(saved[i])inp.value=saved[i].note||''})}function saveHeat(){state.heat={};document.querySelectorAll('.stars').forEach(st=>{let i=st.dataset.h;state.heat[i]={star:+(st.dataset.value||0),note:document.querySelector(`[data-note="${i}"]`).value}});save();alert('已保存热力图。');updateProgress()}function resetHeat(){state.heat={};save();renderHeat();updateProgress()}renderHeat();
mistake.innerHTML=`<div class="title"><div><h3>错题诊断：四问法</h3><p>错题真正的价值，是暴露“下一次还会错在哪里”。</p></div></div><div class="grid two"><div class="card"><h4>错题四问</h4><p>1. 它考哪个模块？<br>2. 我错在概念、公式、步骤、计算、看图还是审题？<br>3. 正确解法的关键一步是什么？<br>4. 下次看到什么信号要提醒自己？</p></div><div class="card"><h4>当前错因排行</h4><table class="smalltable" id="errTable"></table></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">写下今天最重要的 3 个漏洞</h3><textarea id="mistxt" placeholder="例：1. 二次根式有意义总忘 ≥；2. 一次函数看 k、b 不熟；3. 几何证明找不到全等。">${state.mistxt||''}</textarea><div style="margin-top:12px"><button class="btn" onclick="saveMis()">保存漏洞记录</button></div></div>`;function renderErr(){let arr=Object.entries(state.errors||{}).sort((a,b)=>b[1]-a[1]);errTable.innerHTML='<tr><th>错因</th><th>次数</th></tr>'+(arr.length?arr.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join(''):'<tr><td colspan="2">还没有错因记录。先做摸底题。</td></tr>')}function saveMis(){state.mistxt=mistxt.value;save();alert('已保存漏洞记录。');updateProgress()}
summary.innerHTML=`<div class="title"><div><h3>今日收口：下一步怎么做</h3><p>把诊断结果转成明天的复习动作。</p></div></div><div class="diag"><div class="badge"><b id="donePct">0%</b><span>完成度</span></div><div class="badge"><b id="weakCnt">0</b><span>薄弱模块</span></div><div class="badge"><b id="errCnt">0</b><span>错因种类</span></div><div class="badge"><b id="tryCnt">0</b><span>已测题数</span></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h4>明天优先级</h4><p id="nextPlan">先完成摸底题和热力图，我再给你排序。</p></div><div class="card"><h4>5 分钟收口小测</h4><p>√(2x-6) 有意义：<button class="btn secondary" onclick="this.nextElementSibling.style.display='block'">看答案</button><span class="answer">x≥3，因为 2x-6≥0。</span></p><p>y=3x-2 截距：<button class="btn secondary" onclick="this.nextElementSibling.style.display='block'">看答案</button><span class="answer">-2。</span></p></div></div>`;
function updateSummary(){let weak=modules.filter(m=>{let s=state.stats[m]||{try:0,ok:0};return s.try&&s.ok/s.try<.7});weakCnt.textContent=weak.length;errCnt.textContent=Object.keys(state.errors||{}).length;tryCnt.textContent=Object.values(state.stats||{}).reduce((a,b)=>a+(b.try||0),0);nextPlan.textContent=weak.length?`先补：${weak.join('、')}。每个模块先做 10 道基础题，再做 5 道中档题。`:'如果没有明显红区，明天按计划复习二次根式 + 一元二次方程。'}
function updateProgress(){let p=0;document.querySelectorAll('[data-done]').forEach(c=>{if(c.checked)p+=8});let tried=Object.values(state.stats||{}).reduce((a,b)=>a+(b.try||0),0);p+=Math.min(tried*2,32);let heatDone=Object.values(state.heat||{}).filter(x=>x.star).length;p+=Math.min(heatDone*3,24);if((state.mistxt||document.getElementById('mistxt')?.value||'').length>10)p+=12;p=Math.min(100,p);progressBar.style.width=p+'%';progressText.textContent=p+'%';if(window.donePct)donePct.textContent=p+'%';if(window.weakCnt)updateSummary()}function save(){localStorage.setItem('day1v3',JSON.stringify(state));if(window.errTable)setTimeout(renderErr,20)}document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){state.done[e.target.dataset.done]=e.target.checked;save()}updateProgress()});if(CanvasRenderingContext2D&&CanvasRenderingContext2D.prototype&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.beginPath();this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
setTimeout(()=>{renderCoverage();renderErr();updateProgress();drawCurrentTool()},100);
</script>
</body>
